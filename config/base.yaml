project:
  name: rekindle
  seed: 42

data:
  source_name: amazon-reviews-2023-electronics
  recent_window_months: 36
  min_train_interactions: 5
  deduplicate_user_item: true
  raw_reviews_path: data/raw/Electronics.jsonl.gz
  raw_metadata_path: data/raw/meta_Electronics.jsonl.gz
  prepared_interactions_path: data/processed/interactions.parquet
  prepared_items_path: data/processed/items.parquet

split:
  validation_fraction: 0.10
  test_fraction: 0.10
  replay_history_size: 20
  min_prior_interactions: 2

retrieval:
  embedding_dim: 128
  batch_size: 512
  max_epochs: 20
  early_stopping_patience: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  temperature: 0.07
  history_recency_decay: 0.8
  evaluation_batch_size: 128
  evaluation_sampled_negatives: 999
  full_catalog_evaluation_examples: 1000
  progress_every_batches: 50
  sampled_negatives_per_positive: 4
  candidate_count: 200 # per retrieval source; the three-source union has up to 600 candidates
  primary_recall_k: 100
  hnsw_m: 32
  hnsw_ef_search: 128

ranking:
  output_count: 10
  objective: lambdarank
  temporal_folds: 3
  queries_per_fold: 5000

baselines:
  popularity_half_lives_days: [30, 90, 180]
  item_cf_history_size: 20
  item_cf_recency_decay: 0.8

tracking:
  uri: file:./mlruns
  experiment_name: rekindle
